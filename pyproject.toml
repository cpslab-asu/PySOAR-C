[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "soar"
version = "0.1.1"
description = ""
authors = ["Tanmay Khandait <tkhandai@asu.edu>"]
packages = [{include="soar", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "*"
numdifftools = "^0.9.40"
pyswarms = "^1.3.0"
pyswarm = "^0.6"
scipy = "*"
matplotlib = "^3.5.2"
scikit-optimize = "^0.9.0"
jmetalpy = "^1.5.5"
deap = "^1.3.3"
pymoo = "^0.6.0"
polytope = "^0.2.3"
Shapely = "^1.8.2"
psy-taliro = {version = "^1.0.0", extras = ["rtamt"]}
pytest-cov = "^6.0.0"
matlabengine = "23.2.3"
gpytorch = "1.14"
torch = "2.7.0"

[tool.poetry.dev-dependencies]
pytest = "^8"
mypy = "^1"
ruff = "^0.8"

[tool.pyright]
include = ["src"]
stubPath = "src/stubs"

[tool.mypy]
mypy_path = "src/stubs"
files = ["src/**/*.py", "tests/*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "C90",  # Default Flake8 lints
    "A",                           # Built-in shadowing lints
    "B",                           # Bugbear lints
    "I",                           # Isort lints
    "FURB",                        # Modern python lints
    "UP",                          # Upgrade lints
    "C4",                          # List comprehension lints
    "PL",                          # Pylint lints
    "PYI",                         # Stub file lints
    "RET501", "RET502", "RET504",  # Return value lints
    "TC",                          # Type-checking lints
    "N8",                          # Naming plugin
    "TD",                          # TODO plugin
    "TRY",                         # Error handling lints
    "FBT",                         # Boolean trap lints
    "SIM",                         # Simplification lints
    "PTH",                         # Pathlib migration lints
]

[tool.ruff.lint.per-file-ignores]
"src/stubs/**/*.pyi" = ["A002", "N801", "N803"]
