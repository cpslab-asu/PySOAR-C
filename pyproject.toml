[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "soar"
version = "0.1.1"
description = ""
authors = ["Tanmay Khandait <tkhandai@asu.edu>"]
packages = [{include="soar", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
numpy = "*"
numdifftools = "^0.9.40"
pyswarms = "^1.3.0"
pyswarm = "^0.6"
scipy = "*"
matplotlib = "^3.5.2"
scikit-optimize = "^0.9.0"
jmetalpy = "^1.5.5"
deap = "^1.3.3"
pymoo = "^0.6.0"
polytope = "^0.2.3"
Shapely = "^1.8.2"
psy-taliro = {version = "^1.0.0", extras = ["rtamt"]}
pytest-cov = "^6.0.0"

[tool.poetry.dev-dependencies]
pytest = "^8"
mypy = "^1"

[tool.pyright]
include = ["src"]
stubPath = "src/stubs"

[tool.mypy]
mypy_path = "src/stubs"
files = ["src/**/*.py", "tests/*.py"]
